<!DOCTYPE html>
<html>
<head>
<title>Contact Form</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
background-color:#f5f5f5;
font-family:Arial;
}

fieldset{
border:2px solid #007bff;
padding:20px;
}

legend{
color:#007bff;
font-weight:bold;
}

input, select{
margin:5px;
padding:8px;
}
</style>

<script>
function validateForm(){
let name=document.forms["myForm"]["username"].value;
let email=document.forms["myForm"]["email"].value;

if(name==""){
alert("Username must be filled out");
return false;
}

if(email==""){
alert("Email must be filled out");
return false;
}

return true;
}
</script>

</head>

<body>

<div class="container mt-5">

<form name="myForm" onsubmit="return validateForm()">

<fieldset>
<legend>Contact Info</legend>

<label for="username">Username</label>
<input type="text" id="username" name="username" class="form-control"><br>

<label for="email">Email</label>
<input type="email" id="email" name="email" class="form-control"><br>

<label for="telephone">Telephone</label>
<input type="text" id="telephone" name="telephone" class="form-control"><br>

</fieldset>

<br>

<fieldset>
<legend>Job Position</legend>

<label>Choose positions:</label><br>

<input type="checkbox" name="position" value="Account Executive"> Account Executive<br>

<input type="checkbox" name="position" value="Business Development"> Business Development<br>

<input type="checkbox" name="position" value="Inside Sales"> Inside Sales<br>

<input type="checkbox" name="position" value="Sales Manager"> Sales Manager<br>

<input type="checkbox" name="position" value="VP Sales"> VP Sales<br>

</fieldset>

<br>

<fieldset>
<legend>Additional Information</legend>

<label>Type of Position:</label>
<select class="form-select">
<option>Full Time</option>
<option>Part Time</option>
<option>Contract</option>
<option>Internship</option>
</select>

<br><br>

<label>Willing to Relocate?</label><br>

<input type="radio" name="relocate" value="Yes"> Yes<br>
<input type="radio" name="relocate" value="No"> No<br>

<br>

<input type="submit" value="Submit" class="btn btn-primary">
<input type="reset" value="Reset" class="btn btn-secondary">

</fieldset>

</form>

</div>

</body>
</html>
