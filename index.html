<!DOCTYPE html>

<html>
  <head>
    <title>Contact Form</title>
    < link href ="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    

    <form>
      <fieldset>
        <legend>Contact Information</legend>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text"name="username">
      </div>
         <br>
      <div class="form-group">
        <label for="email"> Email </label>
        <input type="text"name="email">
      </div> 
        <br>

      <div class="form-group">
      <label for="telephone">Telephone</label>
      <input type="text"name="telephone">
      </div>
      </fieldset>

      <fieldset>
        <legend>Job Positions</legend>
        <input type="radio" name="job" value="account executive">Account Executive
        <br>
         <input type="radio" name="job" value="business development">Business Development
        <br>
        <input type="radio" name="job" value="inside sales">Inside Sales
        <br>
         <input type="radio" name="job" value="sales manager">Sales Manager
        <br>
         <input type="radio" name="job" value="VP Sales">VP Sales
      </fieldset>

      <fielset>
        <legend>Select Position</legend>
        <div class="form-group">
        <label for="position">Type of position:</label>
        <select name="position" id="position">
          <option value="account executive">Account Executive</option>
          <option value="business development">Business Development</option>
          <option value="inside sales">Inside Sales</option>
          <option value="sales manager">Sales Manager</option>
          <option value="VP Sales">VP Sales</option>
        </select>
        </div>
      </fieldset>

      <fieldset>
        <legend>Willingness to Relocate:</legend>
        
        <div class="form-grpup">
        <input type="radio" id="relocateYes" name="relocate" value="yes" required>
        <label for="relocateYes">Yes</label>
        </div>
        
        <div class="form-grpup">
        <input type="radio" id="relocateNo" name="relocate" value="no">
        <label for="relocateNo">No</label>
        </div>
        
        <div class="form-grpup" >
        <input type="radio" id="relocateMaybe" name="relocate" value="maybe">
        <label for="relocateMaybe">Maybe</label>
        </div>
      </fieldset>

      <fieldset>
         <button type="submit">Submit</button>
         <button type="reset">Reset</button>
      </fieldset>
    </form>
  </body>
</html>
